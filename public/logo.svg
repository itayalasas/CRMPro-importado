<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo con gradiente azul -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Rectángulo redondeado de fondo -->
  <rect width="120" height="120" rx="24" fill="url(#bgGradient)"/>

  <!-- Grid de 4 cuadrados (2x2) representando el CRM -->
  <g transform="translate(30, 30)">
    <!-- Cuadrado superior izquierdo -->
    <rect x="0" y="0" width="24" height="24" rx="4" fill="white" opacity="0.95"/>

    <!-- Cuadrado superior derecho -->
    <rect x="36" y="0" width="24" height="24" rx="4" fill="white" opacity="0.95"/>

    <!-- Cuadrado inferior izquierdo -->
    <rect x="0" y="36" width="24" height="24" rx="4" fill="white" opacity="0.95"/>

    <!-- Cuadrado inferior derecho -->
    <rect x="36" y="36" width="24" height="24" rx="4" fill="white" opacity="0.95"/>
  </g>
</svg>
